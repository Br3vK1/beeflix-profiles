<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BeeFlix Profiles</title>
<style>
:root{color-scheme:dark}body{font:16px system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:24px}.wrap{max-width:900px;margin:auto}.muted{color:#aaa}.card{background:#202020;border:1px solid #383838;border-radius:14px;padding:16px;margin:12px 0}.review{border-top:1px solid #393939;padding:14px 0}.review:first-child{border-top:0}.rating{color:#f4c95d;font-weight:700}.head{display:flex;align-items:center;gap:16px}.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#333}.pill{display:inline-block;padding:5px 9px;border-radius:20px;background:#333;color:#ddd;font-size:13px}button{background:#f2c94c;color:#171717;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}input{background:#222;border:1px solid #555;color:#eee;padding:10px;border-radius:8px;width:min(100%,360px)}.error{color:#ff9b9b}
</style>
</head>
<body><main class="wrap">
<h1>🐝 BeeFlix Community</h1>
<p class="muted">Member profiles · powered by your existing Jellyfin Enhanced reviews</p>
<section class="card">
<h2>Open a member profile</h2>
<p class="muted">Prototype: enter a Jellyfin user ID to preview the profile API. In-app review-card links, taste profiles, activity, and badges are not implemented yet.</p>
<input id="uid" placeholder="Jellyfin user ID" autocomplete="off">
<button id="open">Load profile</button>
<p id="status" class="muted" role="status" aria-live="polite"></p>
</section>
<section id="profile"></section>
</main><script src="beeflix-profiles.js"></script></body>
</html>
