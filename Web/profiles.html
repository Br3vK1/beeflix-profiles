<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BeeFlix Profiles</title>
</head>
<body>
    <div id="BeeFlixProfilesPage" data-role="page" class="page type-interior pluginConfigurationPage">
        <div data-role="content">
            <div class="content-primary">
                <style>
                    #BeeFlixProfilesPage { color: var(--jf-palette-text-primary, inherit); }
                    #BeeFlixProfilesPage .bf-wrap { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
                    #BeeFlixProfilesPage .bf-muted { opacity: .72; }
                    #BeeFlixProfilesPage .bf-card { background: var(--jf-palette-background-paper, rgba(128,128,128,.09)); border: 1px solid var(--jf-palette-divider, rgba(128,128,128,.25)); border-radius: 14px; padding: 1rem; margin: 1rem 0; }
                    #BeeFlixProfilesPage .bf-status { min-height: 1.5em; overflow-wrap: anywhere; }
                    #BeeFlixProfilesPage .bf-review { border-top: 1px solid var(--jf-palette-divider, rgba(128,128,128,.25)); padding: .9rem 0; }
                    #BeeFlixProfilesPage .bf-review:first-child { border-top: 0; }
                    #BeeFlixProfilesPage .bf-rating { margin-left: .65rem; font-weight: 700; }
                    #BeeFlixProfilesPage .bf-pill { display: inline-block; padding: .25rem .55rem; margin: .15rem .25rem .15rem 0; border-radius: 999px; background: var(--jf-palette-action-hover, rgba(128,128,128,.16)); font-size: .9em; }
                    #BeeFlixProfilesPage .bf-profile-head { display: flex; align-items: center; gap: 1rem; }
                    #BeeFlixProfilesPage .bf-avatar { width: 68px; height: 68px; object-fit: cover; border-radius: 50%; background: rgba(128,128,128,.2); }
                    #BeeFlixProfilesPage .bf-error { color: var(--jf-palette-error-main, #ff8080); }
                    #BeeFlixProfilesPage .bf-member-picker { position: relative; max-width: 560px; }
                    #BeeFlixProfilesPage .bf-picker-toggle { display: flex; width: 100%; align-items: center; gap: .8rem; text-align: left; color: inherit; background: var(--jf-palette-background-default, rgba(0,0,0,.12)); border: 1px solid var(--jf-palette-divider, rgba(128,128,128,.35)); padding: .7rem .8rem; min-height: 62px; }
                    #BeeFlixProfilesPage .bf-picker-toggle:focus-visible, #BeeFlixProfilesPage .bf-member-option:focus-visible { outline: 2px solid var(--jf-palette-primary-main, #5b8def); outline-offset: 2px; }
                    #BeeFlixProfilesPage .bf-picker-toggle .bf-selected-name { flex: 1; }
                    #BeeFlixProfilesPage .bf-picker-toggle .bf-chevron { opacity: .7; }
                    #BeeFlixProfilesPage .bf-picker-menu { position: absolute; top: calc(100% + .35rem); left: 0; right: 0; z-index: 20; overflow: hidden; background: var(--jf-palette-background-paper, #20242d); border: 1px solid var(--jf-palette-divider, rgba(128,128,128,.35)); border-radius: 12px; box-shadow: 0 12px 36px rgba(0,0,0,.35); }
                    #BeeFlixProfilesPage .bf-picker-search-wrap { display: block; padding: .7rem; border-bottom: 1px solid var(--jf-palette-divider, rgba(128,128,128,.25)); }
                    #BeeFlixProfilesPage .bf-picker-search { display: block; box-sizing: border-box; width: 100%; padding: .7rem .8rem; border-radius: 8px; color: inherit; background: var(--jf-palette-background-default, rgba(0,0,0,.16)); border: 1px solid var(--jf-palette-divider, rgba(128,128,128,.35)); }
                    #BeeFlixProfilesPage .bf-member-list { max-height: 320px; overflow-y: auto; padding: .25rem; }
                    #BeeFlixProfilesPage .bf-member-option { display: flex; align-items: center; gap: .75rem; width: 100%; box-sizing: border-box; text-align: left; color: inherit; background: transparent; border: 0; border-radius: 8px; padding: .6rem .65rem; cursor: pointer; }
                    #BeeFlixProfilesPage .bf-member-option:hover, #BeeFlixProfilesPage .bf-member-option[aria-selected="true"] { background: var(--jf-palette-action-hover, rgba(128,128,128,.16)); }
                    #BeeFlixProfilesPage .bf-member-option .bf-member-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
                    #BeeFlixProfilesPage .bf-member-avatar { display: block; flex: 0 0 38px; width: 38px; height: 38px; object-fit: cover; border-radius: 50%; background: rgba(128,128,128,.2); }
                    #BeeFlixProfilesPage .bf-empty-members { padding: .9rem; opacity: .72; }
                    #BeeFlixProfilesPage .bf-profile-card { padding: 1.35rem; }
                    #BeeFlixProfilesPage .bf-profile-identity { min-width: 0; flex: 1; }
                    #BeeFlixProfilesPage .bf-profile-name { margin: 0 0 .35rem; overflow-wrap: anywhere; }
                    #BeeFlixProfilesPage .bf-profile-identity p { margin: 0; }
                    #BeeFlixProfilesPage .bf-profile-actions { display: flex; justify-content: flex-end; margin-top: 1rem; }
                    #BeeFlixProfilesPage .bf-share-button, #BeeFlixProfilesPage .bf-load-more { padding: .65rem 1rem; border-radius: 999px; }
                    #BeeFlixProfilesPage .bf-stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; margin-top: 1.25rem; }
                    #BeeFlixProfilesPage .bf-stat { display: flex; flex-direction: column; gap: .3rem; min-width: 0; padding: .9rem; border: 1px solid var(--jf-palette-divider, rgba(128,128,128,.22)); border-radius: 12px; }
                    #BeeFlixProfilesPage .bf-stat strong { font-size: 1.25rem; overflow-wrap: anywhere; }
                    #BeeFlixProfilesPage .bf-history-card { padding-top: .75rem; }
                    #BeeFlixProfilesPage .bf-section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
                    #BeeFlixProfilesPage .bf-section-heading h2 { margin-bottom: .5rem; }
                    #BeeFlixProfilesPage .bf-review-top { display: flex; align-items: baseline; flex-wrap: wrap; gap: .45rem; }
                    #BeeFlixProfilesPage .bf-review-title { color: inherit; font-weight: 700; text-decoration: none; }
                    #BeeFlixProfilesPage .bf-review-title[href]:hover { text-decoration: underline; }
                    #BeeFlixProfilesPage .bf-review-content { white-space: pre-wrap; overflow-wrap: anywhere; }
                    #BeeFlixProfilesPage .bf-load-more { display: block; margin: 1rem auto .25rem; }
                    @media (max-width: 600px) {
                        #BeeFlixProfilesPage .bf-wrap { padding: .65rem; }
                        #BeeFlixProfilesPage .bf-card { padding: .85rem; }
                        #BeeFlixProfilesPage .bf-stat-grid { gap: .4rem; }
                        #BeeFlixProfilesPage .bf-stat { padding: .65rem; }
                        #BeeFlixProfilesPage .bf-stat strong { font-size: 1.05rem; }
                        #BeeFlixProfilesPage .bf-avatar { width: 56px; height: 56px; }
                        #BeeFlixProfilesPage .bf-section-heading { align-items: flex-start; flex-direction: column; gap: 0; }
                    }
                    #BeeFlixProfilesPage [hidden] { display: none !important; }
                </style>

                <main class="bf-wrap">
                    <h1>🐝 BeeFlix Community</h1>
                    <p class="bf-muted">Your BeeFlix profile, your reviews, and the people you watch with.</p>

                    <section class="bf-card" aria-labelledby="bf-profile-lookup-title">
                        <h2 id="bf-profile-lookup-title">Browse members</h2>
                        <p class="bf-muted">Choose any member or share a link to open a specific profile directly.</p>
                        <div class="bf-member-picker">
                            <button id="bf-member-picker-toggle" type="button" is="emby-button" class="bf-picker-toggle" aria-haspopup="listbox" aria-expanded="false" aria-controls="bf-member-list">
                                <img id="bf-selected-avatar" class="bf-member-avatar" alt="" hidden>
                                <span id="bf-selected-name" class="bf-selected-name">Loading members…</span>
                                <span class="bf-chevron material-icons" aria-hidden="true">expand_more</span>
                            </button>
                            <div id="bf-member-picker-menu" class="bf-picker-menu" hidden>
                                <label class="bf-picker-search-wrap" for="bf-member-search">
                                    <span class="bf-muted">Find a member</span>
                                    <input id="bf-member-search" class="bf-picker-search" type="search" autocomplete="off" placeholder="Search names…">
                                </label>
                                <div id="bf-member-list" class="bf-member-list" role="listbox" aria-label="BeeFlix members" tabindex="-1">
                                    <div class="bf-empty-members">Loading members…</div>
                                </div>
                            </div>
                        </div>
                        <p id="bf-status" class="bf-status" role="status" aria-live="polite">Loading the member directory…</p>
                    </section>
                    <section id="bf-profile-result" aria-live="polite"></section>
                </main>

                <!-- Jellyfin-web parses plugin pages as HTML fragments and disables plain script tags.
                     Dynamically load the registered embedded JS page instead. This inline bootstrap
                     is excluded from Cloudflare Rocket Loader to avoid a silently blank page. -->
                <script data-cfasync="false">
                    (function () {
                        var status = document.getElementById('bf-status');
                        var script = document.createElement('script');
                        script.src = 'configurationpage?name=beeflix-profiles.js';
                        script.onload = function () {
                            if (status && !window.BeeFlixProfilesPageInitialized) {
                                status.textContent = 'The page loaded, but profile tools did not initialize. Refresh the page and check the browser console.';
                            }
                        };
                        script.onerror = function () {
                            if (status) {
                                status.textContent = 'The profile page loaded, but its JavaScript file could not be fetched. The plugin may need an update or Jellyfin restart.';
                                status.classList.add('bf-error');
                            }
                        };
                        document.head.appendChild(script);
                    })();
                </script>
            </div>
        </div>
    </div>
</body>
</html>
